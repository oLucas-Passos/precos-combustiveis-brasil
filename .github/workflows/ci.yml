name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Testes
        run: pytest --cov=combustiveis --cov-report=term-missing
      - name: Executar pipeline completo
        run: python -m combustiveis
